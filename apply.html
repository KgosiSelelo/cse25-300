    <title>Apply for Loan</title>

</head>
<body style="background-image: url('backgroud.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

    <h1 style="color: aliceblue;">KMS LOANS ENTERPRISE</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="apply.html">Apply for Loan</a> |

        <a href="contact.html">Contact</a> |

    <hr>

    <!-- PAGE CONTENT — flex:1 pushes footer to bottom -->
    <div style="flex: 1; padding: 20px;">

        <h2>Loan Application Form</h2>

        <form id="loanForm">

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label>Date of Birth:</label>
            <input type="date" id="dob">

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone:</label>
            <input type="text" id="phone" placeholder="+267 ">

            <label>School/University:</label>
            <input type="text" id="school" placeholder="Enter your school or university">

            <label>Course of Study:</label>
            <input type="text" id="course" placeholder="Enter your course of study">

            <label>Upload Documents:</label>
            <input type="file" id="documents">

            <br><br>

            <input type="submit" value="Submit Application" onclick="submitApplication(); return false;">

        </form>

    </div>

    <footer>
        <p>Contact: +26777908917</p>
        <p>Email: kmsloansenterprise.com</p>
        <p>&copy; 2026 KMS LOANS ENTERPRISE. All Rights Reserved</p>
    </footer>
